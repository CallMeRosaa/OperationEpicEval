# FICTIONAL example. Real rules are entered by each unit's SEL through the admin UI.
# Units inherit from the wing template and override only what differs.
org:
  wing: 999th Test Wing
  groups:
    - name: 999th Maintenance Group
      squadrons:
        - name: 999th Aircraft Maintenance Squadron
          sel_role: SEL                      # owns award setup for this squadron
          flights: [Alpha Flight, Bravo Flight, Quality Assurance Flight]

tiers:                                       # eligibility categories
  - id: tier1
    label: Tier 1
    eligible: { grades: [E-1, E-2, E-3, E-4] }
  - id: tier2
    label: Tier 2
    eligible: { grades: [E-5, E-6] }
  - id: tier3
    label: Tier 3
    eligible: { grades: [E-7, E-8], duty_titles_any: [Inspector] }
  - id: civilian
    label: Civilian
    eligible: { categories: [GS, WG] }

award_programs:
  - id: maint-pro-qtr
    name: Maintenance Professional of the Quarter
    cadence: QUARTERLY
    tiers: [tier1, tier2, tier3, civilian]
    format:
      style: NARRATIVE                       # NARRATIVE | BULLET
      sections:
        - name: Job Performance in Primary Duty
          statements: { min: 5, max: 5 }
          max_lines_per_statement: 6
      line_fit: { form: AF1206, font: Times New Roman, size_pt: 12, width_in: 7.5 }
    advances_to: group-maint-pro-qtr         # winner goes up to the group-level board
    board: { scoring: RUBRIC, anonymized: true }

routing_templates:
  - id: squadron-quarterly
    steps:
      - { role: MEMBER,              action: DRAFT }
      - { role: FIRST_SUPERVISOR,    action: REVIEW,     can_return: true }
      - { role: FLIGHT_LEADERSHIP,   action: COORDINATE, can_return: true }
      - { role: SEL,                 action: APPROVE_NOMINATION }
      - { role: BOARD,               action: SCORE }

cycle_defaults:                              # offsets from the end of the quarter
  maint-pro-qtr:
    routing: squadron-quarterly
    milestones:
      - { step: MEMBER,            due: "+5d",  label: Drafts due to first supervisor }
      - { step: FIRST_SUPERVISOR,  due: "+10d", label: Supervisor review complete }
      - { step: FLIGHT_LEADERSHIP, due: "+15d", label: Drafts due to flight leadership }
      - { step: SEL,               due: "+20d", label: Nominations due to SEL }
      - { step: BOARD,             due: "+30d", label: Board convenes }
